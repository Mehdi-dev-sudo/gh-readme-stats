name: Refresh stats and auto-commit

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  USERNAME: ${{ github.repository_owner }}
  GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Regenerate SVG cards
        run: node scripts/generate-svgs.mjs ./svgs

      - name: Write activity timestamp
        shell: bash
        run: |
          mkdir -p .stats
          printf '{"updated_at":"%s","run_id":"%s"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$GITHUB_RUN_ID" > .stats/last-update.json

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "${{ github.repository_owner }}"
          git config user.email "${{ github.repository_owner }}@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: refresh stats cards [skip ci]"
            git push
          fi